<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Maverick Lens</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&family=Geist:wght@400;500;600;700&display=swap');
:root{--bg:#090909;--surface:#121212;--raised:#171717;--border:#2a2a2a;--text:#f5f5f5;--muted:#a3a3a3;--orange:#ff6a00;--orange-hover:#ff7a1a;--green:#9bd78e;--amber:#ffbd59;font-family:Geist,Inter,system-ui,sans-serif;color:var(--text);background:var(--bg)}*{box-sizing:border-box}body{margin:0;background:radial-gradient(800px 420px at 88% -80px,#35200b 0%,transparent 68%),var(--bg);min-width:320px}button,input{font:inherit}.app{min-height:100vh;display:flex}.side{position:sticky;top:0;width:254px;height:100vh;padding:26px 14px;border-right:1px solid var(--border);background:#0b0b0b;display:flex;flex-direction:column}.brand{display:flex;align-items:center;gap:10px;padding:0 13px 29px;font-family:"Geist Mono",ui-monospace,monospace;font-size:13px;font-weight:600;letter-spacing:.11em}.brand-mark{display:grid;place-items:center;width:30px;height:30px;border:1px solid #6b3614;border-radius:8px;color:var(--orange);font-size:17px}.brand small{display:block;margin-top:4px;color:var(--muted);font-size:9px;letter-spacing:.13em}.nav-label{padding:0 13px 9px;color:#737373;font-family:"Geist Mono",ui-monospace,monospace;font-size:9px;letter-spacing:.12em}.nav{display:grid;gap:3px}.nav button{display:flex;align-items:center;gap:10px;width:100%;padding:10px 13px;border:0;border-radius:8px;background:transparent;color:var(--muted);text-align:left;cursor:pointer;transition:.16s}.nav button::before{content:"";width:6px;height:6px;border:1px solid #555;border-radius:50%}.nav button:hover{background:var(--raised);color:var(--text)}.nav button.on{background:#291a10;color:var(--text);box-shadow:inset 2px 0 var(--orange)}.nav button.on::before{border-color:var(--orange);background:var(--orange)}.side-foot{margin-top:auto;padding:15px 13px 4px;border-top:1px solid var(--border);color:var(--muted);font-size:11px;line-height:1.5}.side-foot b{color:var(--text);font-family:"Geist Mono",ui-monospace,monospace;font-size:10px}.main{width:calc(100% - 254px);max-width:1660px;margin:0 auto;padding:0 34px 52px}.top{height:78px;display:flex;align-items:center;gap:20px;border-bottom:1px solid var(--border)}.crumb{min-width:250px;font-size:13px}.crumb strong{color:var(--text)}.crumb span{color:#666;padding:0 6px}.search-wrap{position:relative;flex:1;max-width:500px;margin-left:auto}.search-wrap::before{content:"⌕";position:absolute;top:8px;left:12px;color:#777;font-size:18px}.search{width:100%;height:38px;padding:0 14px 0 35px;border:1px solid var(--border);border-radius:8px;outline:0;background:#101010;color:var(--text);transition:border .16s}.search:focus{border-color:#8d4918}.badge{display:inline-flex;align-items:center;gap:7px;padding:7px 10px;border:1px solid #653415;border-radius:999px;color:#ffa966;font-family:"Geist Mono",ui-monospace,monospace;font-size:10px;font-weight:600;letter-spacing:.06em}.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--orange);box-shadow:0 0 0 3px #38200e}.page{padding-top:34px}.eyebrow,.label{color:var(--orange);font-family:"Geist Mono",ui-monospace,monospace;font-size:10px;font-weight:600;letter-spacing:.13em;text-transform:uppercase}.hero{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:stretch;margin-bottom:24px}.hero-copy{padding:8px 0 0}.hero h1{max-width:760px;margin:12px 0;font-size:clamp(34px,4vw,58px);line-height:.98;letter-spacing:-.065em}.hero p{max-width:680px;margin:0;color:var(--muted);font-size:16px;line-height:1.6}.hero-actions{display:flex;align-items:flex-end;gap:10px;margin-top:24px}.btn{height:39px;padding:0 14px;border:1px solid var(--border);border-radius:8px;background:var(--raised);color:var(--text);font-size:12px;font-weight:600;cursor:pointer;transition:.16s}.btn:hover{border-color:#7b4119}.btn.primary{border-color:var(--orange);background:var(--orange);color:#120a04}.btn.primary:hover{background:var(--orange-hover)}.readiness{display:flex;flex-direction:column;justify-content:space-between;padding:22px;border:1px solid #573014;border-radius:14px;background:linear-gradient(145deg,#21150d,#121212 70%)}.readiness-top{display:flex;justify-content:space-between;align-items:flex-start}.readiness strong{display:block;margin-top:6px;font-size:24px;letter-spacing:-.04em}.readiness p{margin:8px 0 0;color:var(--muted);font-size:12px;line-height:1.45}.score{font-family:"Geist Mono",ui-monospace,monospace;color:#ffb26d;font-size:12px}.score b{font-size:30px;letter-spacing:-.08em}.readiness-track{height:6px;margin-top:22px;border-radius:99px;background:#342012;overflow:hidden}.readiness-track i{display:block;width:var(--p);height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--orange),#ffad5f)}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:24px}.card,.panel{border:1px solid var(--border);border-radius:12px;background:var(--surface)}.card{position:relative;min-height:142px;padding:19px;overflow:hidden}.card::after{content:"";position:absolute;right:-30px;bottom:-46px;width:110px;height:110px;border:1px solid #2e2118;border-radius:50%}.card .num{position:relative;margin:17px 0 5px;font-size:35px;font-weight:600;letter-spacing:-.06em}.muted{color:var(--muted)}small{display:block;color:var(--muted);font-size:12px;line-height:1.45}.layout{display:grid;grid-template-columns:minmax(0,1.58fr) minmax(310px,.84fr);gap:20px}.stack{display:grid;gap:20px}.panel{padding:20px}.head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:18px}.head h2{margin:0;font-size:16px;letter-spacing:-.03em}.head span{color:var(--muted);font-family:"Geist Mono",ui-monospace,monospace;font-size:10px;white-space:nowrap}.panel-link{border:0;background:none;color:#ffa966;font-size:11px;font-weight:600;cursor:pointer}.activity{display:grid;grid-template-columns:1fr 158px;gap:15px;min-height:208px}.chart{width:100%;height:192px;overflow:visible}.chart-grid{stroke:#282828;stroke-width:1}.chart-fill{fill:url(#chartGradient)}.chart-line{fill:none;stroke:var(--orange);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.chart-dot{fill:var(--orange);stroke:#1c120a;stroke-width:5}.chart-label{fill:#777;font-family:"Geist Mono",ui-monospace,monospace;font-size:9px}.chart-summary{display:flex;flex-direction:column;justify-content:center;gap:13px;border-left:1px solid var(--border);padding-left:18px}.chart-summary b{display:block;margin-bottom:3px;font-size:17px;letter-spacing:-.03em}.chart-summary span{font-family:"Geist Mono",ui-monospace,monospace;font-size:10px;color:var(--muted)}.row{display:flex;justify-content:space-between;gap:16px;align-items:center;padding:15px 0;border-top:1px solid var(--border)}.row:first-of-type{border-top:0}.row b{font-size:13px}.row small{margin-top:4px}.status{display:inline-flex;align-items:center;gap:6px;flex:0 0 auto;font-family:"Geist Mono",ui-monospace,monospace;font-size:10px}.status::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}.ok{color:var(--green)}.warn{color:var(--amber)}.lanes .row{padding:16px 10px;border-radius:8px}.lane-meta{display:flex;align-items:center;gap:8px}.lane-id{color:#777;font-family:"Geist Mono",ui-monospace,monospace;font-size:10px}.donut-box{display:flex;align-items:center;gap:20px}.donut{display:grid;place-items:center;width:126px;height:126px;border-radius:50%;background:conic-gradient(var(--orange) calc(var(--p)*1%),#30251e 0)}.donut::before{content:"";grid-area:1/1;width:99px;height:99px;border-radius:50%;background:var(--surface)}.donut b{grid-area:1/1;z-index:1;font-size:26px;letter-spacing:-.06em}.signal{padding:13px 14px;border:1px solid #3a2a1d;border-radius:9px;background:#1b1712}.signal p{margin:6px 0 0;color:#c5b5a7;font-size:12px;line-height:1.45}.workflow{display:grid;gap:12px}.bar{display:grid;grid-template-columns:105px 1fr 22px;align-items:center;gap:12px;font-size:12px}.track{height:7px;border-radius:99px;background:#242424;overflow:hidden}.fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--orange),#ffb56e)}.fill.alt{background:#6d6256}.table{width:100%;border-collapse:collapse;text-align:left}.table th{padding:0 13px 12px;color:#777;border-bottom:1px solid var(--border);font-family:"Geist Mono",ui-monospace,monospace;font-size:10px;font-weight:500;letter-spacing:.05em;text-transform:uppercase}.table td{padding:15px 13px;border-bottom:1px solid var(--border);font-size:13px}.table tbody tr:last-child td{border-bottom:0}.table td:first-child{font-weight:600}.empty{padding:24px;color:var(--muted);font-size:13px}.page-title{margin:0 0 8px;font-size:36px;letter-spacing:-.055em}.page-intro{margin:0 0 24px;color:var(--muted)}@media(max-width:1100px){.hero{grid-template-columns:1fr}.readiness{min-height:160px}.metrics{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:1fr}.activity{grid-template-columns:1fr}.chart-summary{display:none}}@media(max-width:760px){.side{position:fixed;z-index:10;bottom:0;top:auto;width:100%;height:auto;padding:7px 8px;border-top:1px solid var(--border);border-right:0}.brand,.nav-label,.side-foot{display:none}.nav{display:flex;justify-content:space-between;overflow:auto}.nav button{width:auto;padding:9px 10px;font-size:11px}.nav button:nth-child(n+6){display:none}.main{width:100%;padding:0 17px 84px}.top{gap:10px;height:66px}.crumb{min-width:0;font-size:11px}.crumb span{display:none}.search-wrap{display:none}.badge{font-size:9px;padding:6px 8px}.page{padding-top:24px}.hero h1{font-size:39px}.metrics{grid-template-columns:1fr 1fr;gap:10px}.card{min-height:122px;padding:15px}.card .num{font-size:29px}.panel{padding:16px}.head span{display:none}.bar{grid-template-columns:80px 1fr 20px}.table{min-width:620px}.panel{overflow:auto}}
</style><div id="app"></div><script src="/interactions.js"></script><script>
let d,route='Overview';const nav=['Overview','Tasks','Specs','Docs','Git','CLI','Capabilities','Architecture','Agents','Adapters','Lab'];const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const pct=(v,t)=>t?Math.round(v/t*100):0;const list=(a,f,e)=>a?.length?a.map(f).join(''):`<div class="empty">${e}</div>`;function table(a,h,f,e){return `<div class="panel"><table class="table"><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${a.length?a.map(x=>`<tr>${f(x).map(v=>`<td>${esc(v)}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="${h.length}" class="empty">${e}</td></tr>`}</tbody></table></div>`}function chart(done,total){const p=total?done/total:0,b=Math.round(18+p*32);return `<svg class="chart" viewBox="0 0 620 192" preserveAspectRatio="none"><defs><linearGradient id="chartGradient" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#ff6a00" stop-opacity=".26"/><stop offset="1" stop-color="#ff6a00" stop-opacity="0"/></linearGradient></defs><path class="chart-grid" d="M0 32H620M0 86H620M0 140H620"/><path class="chart-fill" d="M0 150 L92 134 L185 144 L278 ${116-b/4} L371 127 L464 ${93-b/5} L560 ${112-b/3} L620 ${76-b/4} V192 H0Z"/><path class="chart-line" d="M0 150 L92 134 L185 144 L278 ${116-b/4} L371 127 L464 ${93-b/5} L560 ${112-b/3} L620 ${76-b/4}"/><circle class="chart-dot" cx="620" cy="${76-b/4}" r="5"/><text class="chart-label" x="0" y="181">INDEX</text><text class="chart-label" x="142" y="181">CONTEXT</text><text class="chart-label" x="290" y="181">BUILD</text><text class="chart-label" x="442" y="181">VERIFY</text><text class="chart-label" x="580" y="181">REVIEW</text></svg>`}function overview(){const n=d.tasks.length,e=d.tasks.filter(t=>t.validation==='evidence captured').length,c=pct(e,n),by=Object.entries(d.tasks.reduce((m,t)=>(m[t.preset]=(m[t.preset]||0)+1,m),{})),max=Math.max(1,...by.map(x=>x[1]));return `<section class="hero"><div class="hero-copy"><div class="eyebrow">Maverick Lens / local control room</div><h1>Make delivery<br>visible before it ships.</h1><p>One local index for task context, evidence and project structure — designed to make the next engineering decision obvious.</p><div class="hero-actions"><button class="btn primary" onclick="route='Tasks';render()">Inspect tasks →</button><button class="btn" onclick="refresh()">↻ Refresh index</button></div></div><aside class="readiness"><div class="readiness-top"><div><span class="label">Evidence health</span><strong>${c}% covered</strong><p>${e} of ${n} active tasks have verification evidence.</p></div><span class="score"><b>${c}</b>/100</span></div><div class="readiness-track"><i style="--p:${c}%"></i></div></aside></section><section class="metrics">${[['Active tasks',n,'workflows in local index'],['Evidence coverage',c+'%',e+' recorded verifications'],['Attention signals',d.signals.length,'items require a decision'],['Source modules',d.modules.length,'repository surfaces mapped']].map(x=>`<article class="card"><span class="label">${x[0]}</span><div class="num">${x[1]}</div><small>${x[2]}</small></article>`).join('')}</section><section class="layout"><div class="stack"><article class="panel"><div class="head"><div><h2>Delivery signal</h2><span>local task progress across the current workflow</span></div><button class="panel-link" onclick="route='Tasks';render()">View tasks</button></div><div class="activity">${chart(e,n)}<div class="chart-summary"><div><span>VERIFIED</span><b>${e} task${e===1?'':'s'}</b></div><div><span>OUTSTANDING</span><b>${Math.max(0,n-e)} task${n-e===1?'':'s'}</b></div><div><span>LOCAL SCOPE</span><b>${d.docs.length} docs</b></div></div></div></article><article class="panel lanes"><div class="head"><div><h2>Delivery lanes</h2><span>click a lane to inspect complete task context</span></div><span>${n} ACTIVE</span></div>${list(d.tasks.slice(0,6),t=>`<div class="row interactive-row"><div><b>${esc(t.title||t.id)}</b><div class="lane-meta"><span class="lane-id">${esc(t.id)}</span><small>· ${t.artifacts.length} artifacts · ${t.reports.length} reports</small></div></div><span class="status ${t.validation==='evidence captured'?'ok':'warn'}">${esc(t.validation)}</span></div>`,'No tasks found.')}</article></div><aside class="stack"><article class="panel"><div class="head"><h2>Evidence status</h2><span>not approval</span></div><div class="donut-box"><div class="donut" style="--p:${c}"><b>${c}%</b></div><p class="muted">Evidence makes work inspectable. Human review still decides whether it is ready.</p></div></article><article class="panel"><div class="head"><h2>Needs attention</h2><span>${d.signals.length} SIGNALS</span></div>${list(d.signals,s=>`<div class="signal"><span class="status warn">${esc(s.level||'warning')}</span><p>${esc(s.text)}</p></div>`,'<span class="status ok">No observable signals require attention.</span>')}</article><article class="panel"><div class="head"><h2>Workflow composition</h2><span>tasks by preset</span></div><div class="workflow">${list(by,([k,v],i)=>`<div class="bar"><span>${esc(k)}</span><div class="track"><div class="fill ${i?'alt':''}" style="width:${v/max*100}%"></div></div><b>${v}</b></div>`,'No preset data.')}</div></article></aside></section>`}function generic(){const a=d[route.toLowerCase()]||[];return `<section><h1 class="page-title">${route}</h1><p class="page-intro">Local project assets indexed by Lens.</p><div class="panel">${list(a,x=>`<div class="row"><div><b>${esc(x.name||x.id||x.title||x.path)}</b><small>${esc(x.path||x.description||x.status||'')}</small></div></div>`,'No entries found.')}</div></section>`}function refresh(){fetch('/api/refresh',{method:'POST'}).then(()=>location.reload())}function content(){if(route==='Overview')return overview();if(route==='Tasks')return `<section><h1 class="page-title">Tasks</h1><p class="page-intro">Open any task to inspect scope, verification and local artifacts.</p>${table(d.tasks,['Task','Preset','Evidence','Updated'],t=>[t.id,t.preset,t.validation,new Date(t.updated).toLocaleDateString()],'No tasks found.')}</section>`;if(route==='Specs')return `<section><h1 class="page-title">Specs</h1><p class="page-intro">Specs captured in the local project index.</p>${table(d.specs,['Title','Status','Path'],x=>[x.title,x.status,x.path],'No specs found.')}</section>`;if(route==='CLI')return `<section><h1 class="page-title">CLI</h1><p class="page-intro">Commands exposed by this installed Maverick workspace.</p>${table(d.commands,['Command','Aliases','Description','Example'],x=>[x.command,x.aliases.join(', ')||'—',x.description,x.example],'No commands found.')}</section>`;if(route==='Architecture')return `<section><h1 class="page-title">Architecture</h1><p class="page-intro">Source modules discovered by the local index.</p>${table(d.modules,['Module','Kind','Confidence'],x=>[x.path,x.kind,x.confidence],'No source modules found.')}</section>`;return generic()}function render(){document.querySelector('#app').innerHTML=`<div class="app"><aside class="side"><div class="brand"><span class="brand-mark">⚔</span><span>MAVERICK LENS<small>LOCAL INTELLIGENCE</small></span></div><div class="nav-label">WORKSPACE</div><nav class="nav">${nav.filter(x=>x!=='Lab'||d.lab.length).map(x=>`<button class="${route===x?'on':''}" onclick="route='${x}';render()">${x}</button>`).join('')}</nav><div class="side-foot"><b>AI WRITES. ENGINEERS DECIDE.</b><br>Local-only project intelligence.</div></aside><main class="main"><header class="top"><div class="crumb"><strong>${esc(d.project.name)}</strong><span>/</span>${esc(d.project.activePreset)} workflow</div><div class="search-wrap"><input class="search" placeholder="Search tasks, docs, commands…" oninput="search(this.value)"></div><span class="badge">LOCAL INDEX</span></header><div class="page">${content()}</div></main></div>`}function search(q){if(!q)return render();q=q.toLowerCase();const r=[];for(const[k,a]of Object.entries(d))if(Array.isArray(a))a.forEach(x=>JSON.stringify(x).toLowerCase().includes(q)&&r.push([k,x.title||x.name||x.id||x.command||x.path,x.path||x.description||'']));document.querySelector('.page').innerHTML=`<section><h1 class="page-title">Search results</h1><p class="page-intro">${r.length} local matches for “${esc(q)}”.</p><div class="panel">${list(r,x=>`<div class="row"><div><b>${esc(x[1])}</b><small>${esc(x[0])} · ${esc(x[2])}</small></div></div>`,'No local matches.')}</div></section>`}fetch('/api/project').then(r=>r.json()).then(x=>{d=x;render()})
</script></html>
