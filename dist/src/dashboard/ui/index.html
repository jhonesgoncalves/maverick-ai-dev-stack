<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Maverick Lens</title><style>*{box-sizing:border-box}body{margin:0;background:#0d1014;color:#e8edf2;font:14px system-ui}.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}.side{padding:24px 12px;background:#101419;border-right:1px solid #28313b}.brand{color:#ff6a00;font-weight:800;letter-spacing:.1em;margin:6px 10px 24px}.nav button{display:block;width:100%;border:0;border-radius:6px;background:none;color:#aeb8c3;padding:10px;text-align:left;cursor:pointer}.nav button:hover,.nav .on{background:#252b33;color:#fff}.main{padding:24px;max-width:1500px}.top{display:flex;justify-content:space-between;gap:12px}.search{background:#171d24;border:1px solid #313943;color:#fff;padding:10px;border-radius:7px;width:min(450px,55vw)}.local{font-size:11px;color:#95d5a5;border:1px solid #355941;padding:6px;border-radius:18px;height:max-content}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:20px 0}.card,.panel{background:#141a21;border:1px solid #28313b;border-radius:9px;padding:16px}.panel{margin:14px 0}.num{font-size:28px;font-weight:700;margin-top:7px}.tag{color:#ff9b5c;font-size:11px;text-transform:uppercase}.muted,.empty{color:#9ba7b4}.item{padding:11px 0;border-bottom:1px solid #28313b}.warn{border-left:3px solid #ffb020;padding-left:9px}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:10px;border-bottom:1px solid #28313b}.table th{color:#9ba7b4;font-size:11px;text-transform:uppercase}@media(max-width:700px){.app{grid-template-columns:1fr}.side{border-bottom:1px solid #28313b}.nav{display:flex;overflow:auto}.nav button{width:auto;white-space:nowrap}.main{padding:16px}.top{flex-direction:column}.search{width:100%}}</style><div id="app"></div><script>let d,route='Overview';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));const nav=['Overview','Tasks','Specs','Docs','Git','CLI','Capabilities','Architecture','Agents','Adapters','Lab'];const items=(a,f,e)=>a?.length?a.map(f).join(''):`<div class=empty>${e}</div>`;function table(a,h,f,e){return `<div class=panel><table class=table><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${a.length?a.map(x=>`<tr>${f(x).map(v=>`<td>${esc(v)}</td>`).join('')}</tr>`).join(''):`<tr><td colspan=${h.length} class=empty>${e}</td></tr>`}</tbody></table></div>`}function render(){let v='';if(route==='Overview'){let c=[['Tasks',d.tasks.length],['Specs',d.specs.length],['Docs',d.docs.length],['ADRs',d.adrs.length],['Modules',d.modules.length],['Artifacts',d.tasks.reduce((n,t)=>n+t.artifacts.length,0)]];v=`<p class=tag>⚔ MAVERICK LENS</p><h1>Project Intelligence</h1><p class=muted>See the system. Not just the code.</p><div class=grid>${c.map(x=>`<div class=card><span class=tag>${x[0]}</span><div class=num>${x[1]}</div></div>`).join('')}</div><div class=panel><h2>Needs Attention</h2>${items(d.signals,x=>`<div class="item warn">${esc(x.text)}</div>`,'No observable signals require attention.')}</div><div class=panel><h2>What’s available</h2>${items(d.capabilities,x=>`<div class=item><b>${esc(x.name)}</b><div class=muted>${esc(x.description)}</div></div>`,'No capabilities found.')}</div>`}else if(route==='Tasks')v=table(d.tasks,['Task','Preset','Validation','Updated'],x=>[x.id,x.preset,x.validation,new Date(x.updated).toLocaleDateString()],'No tasks found.');else if(route==='Specs')v=table(d.specs,['Title','Status','Path'],x=>[x.title,x.status,x.path],'No specs found.');else if(route==='Docs')v=`<h1>Docs</h1><div class=panel>${items(d.docs.slice(0,300),x=>`<div class=item><span class=tag>${x.type}</span> <b>${esc(x.title)}</b><div class=muted>${esc(x.path)} — ${esc(x.excerpt)}</div></div>`,'No docs found.')}</div>`;else if(route==='Git')v=`<h1>Git · ${esc(d.git.branch)}</h1><div class=panel><h2>Recent commits</h2>${items(d.git.commits,x=>`<div class=item>${esc(x)}</div>`,'No Git history available.')}<h2>Working tree</h2>${items(d.git.changes,x=>`<div class=item>${esc(x)}</div>`,'Working tree clean.')}</div>`;else if(route==='CLI')v=table(d.commands,['Command','Aliases','Description','Example'],x=>[x.command,x.aliases.join(', ')||'—',x.description,x.example],'No commands found.');else if(route==='Capabilities')v=`<h1>Maverick Capabilities</h1>${items(d.capabilities,x=>`<div class=panel><span class=tag>${x.category} · ${x.status}</span><h2>${esc(x.name)}</h2><p class=muted>${esc(x.description)}</p><div>${esc(x.commands.join(', ')||'No command')}</div></div>`,'No capabilities found.')}`;else if(route==='Architecture')v=`<h1>Architecture</h1><p class=muted>Filename-based module discovery; no AST scanner is installed.</p>${table(d.modules.slice(0,300),['Module','Kind','Confidence'],x=>[x.path,x.kind,x.confidence],'No source modules found.')}`;else{let a=d[route.toLowerCase()]||[];v=`<h1>${route}</h1><div class=panel>${items(a,x=>`<div class=item><b>${esc(x.name||x.id||x.path)}</b><div class=muted>${esc(x.path||x.status||'')}</div></div>`,'No entries found.')}</div>`}document.querySelector('#app').innerHTML=`<div class=app><aside class=side><div class=brand>⚔ MAVERICK<br>LENS</div><div class=nav>${nav.filter(x=>x!=='Lab'||d.lab.length).map(x=>`<button class="${route===x?'on':''}" onclick="route='${x}';render()">${x}</button>`).join('')}</div></aside><main class=main><div class=top><span class=muted>${esc(d.project.name)} · ${esc(d.project.activePreset)}</span><input class=search placeholder="Search anything… ⌘/Ctrl K" oninput="search(this.value)"><span class=local>LOCAL ONLY</span></div>${v}</main></div>`}function search(q){if(!q)return render();q=q.toLowerCase();let r=[];for(let[k,a]of Object.entries(d))if(Array.isArray(a))a.forEach(x=>JSON.stringify(x).toLowerCase().includes(q)&&r.push([k,x.title||x.name||x.id||x.command||x.path,x.path||x.description||'']));document.querySelector('.main').innerHTML=`<div class=top><h1>Search</h1><input autofocus class=search value="${esc(q)}" oninput="search(this.value)"></div><div class=panel>${items(r,x=>`<div class=item><span class=tag>${x[0]}</span> <b>${esc(x[1])}</b><div class=muted>${esc(x[2])}</div></div>`,'No local matches.')}</div>`}fetch('/api/project').then(r=>r.json()).then(x=>{d=x;render()});document.addEventListener('keydown',e=>{if(((e.metaKey||e.ctrlKey)&&e.key==='k')||(e.key==='/'&&document.activeElement.tagName!=='INPUT')){e.preventDefault();document.querySelector('.search')?.focus()}})</script>
