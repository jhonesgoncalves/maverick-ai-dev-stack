apiVersion: maverick.flow/v1
name: ship
description: Takes a task from implemented to ready for a human merge decision, running every evidence gate.
contract:
  goal: Every blocking gate for {{task}} passes and a human has recorded a review decision.
  iterationCap: 3
  noProgressWindow: 2
gates:
  - id: artifacts
    type: maverick
    run: validate
    description: Task artifacts contain every required section.
  - id: checks
    type: maverick
    run: verify
    description: Lint, typecheck, tests and build pass for the detected stack.
  - id: scope
    type: maverick
    run: guard
    severity: warn
    description: Changed files stay within the declared task scope.
  - id: integrity
    type: maverick
    run: integrity
    severity: warn
    description: No test was deleted, skipped or weakened, and no check configuration changed unannounced.
  - id: ablation
    type: maverick
    run: ablation
    severity: warn
    description: Every new or changed test fails without the change; a test that cannot fail is reported.
  - id: architecture
    type: maverick
    run: architecture
    severity: warn
    description: The change adds no import cycle or boundary violation, and does not lower architecture health past the limit.
  - id: contracts
    type: maverick
    run: contracts
    description: Every living contract the change touches is kept (its tests pass) or revoked in the PRD.
  - id: security
    type: maverick
    run: security
    description: No high-signal security patterns in the diff.
  - id: dependencies
    type: maverick
    run: deps
    severity: warn
    description: Dependency changes are reported for review.
  - id: diff-review
    type: maverick
    run: review
    severity: warn
    description: Automated diff findings are written for the reviewer.
  - id: review-budget
    type: maverick
    run: attention
    severity: warn
    description: Hunks ranked by risk and a proof tree per criterion, so the reviewer knows where to look first.
  - id: explain-back
    type: maverick
    run: explain
    severity: warn
    description: With review.explainBack on, a read-only agent asks the reviewer three questions about what the change does (never blocks).
  - id: human-review
    type: approval
    prompt: A human reviews the change and records the decision.
    file: REVIEW.md
    pattern: "- \\[[xX]\\] (?:approve|approve with follow-up)"
    description: A human approved the change in REVIEW.md or with maverick flow approve.
