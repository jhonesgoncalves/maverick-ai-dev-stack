<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-labelledby="title desc">
<title id="title">Maverick AI in a terminal</title>
<desc id="desc">maverick new turns one sentence into a spec-driven task grounded in the code and opens Claude Code; maverick impact lists the dependents, entry points and tests a change affects; maverick flow run ship passes every evidence gate and waits for a human review decision.</desc>
<defs>
<radialGradient id="glow" cx="1080" cy="0" r="620" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#FF6B00" stop-opacity=".16"/><stop offset="1" stop-color="#FF6B00" stop-opacity="0"/></radialGradient>
<clipPath id="screen"><rect x="19" y="63" width="1162" height="638" rx="13"/></clipPath>
