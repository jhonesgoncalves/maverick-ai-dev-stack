tion:l10 26s linear infinite}@keyframes l11{0%,43.077%{opacity:0}43.654%,93.846%{opacity:1}96.538%,100%{opacity:0}}.l11{animation:l11 26s linear infinite}@keyframes tl11{0%,43.077%{opacity:0;transform:translateX(0)}43.115%{opacity:1;transform:translateX(0);animation-timing-function:steps(60,end)}50.923%{opacity:1;transform:translateX(541.8px)}52.269%{opacity:1;transform:translateX(541.8px)}52.308%,100%{opacity:0;transform:translateX(1200px)}}.tl11{animation:tl11 26s linear infinite}@keyframes l12{0%,52.308%{opacity:0}52.885%,93.846%{opacity:1}96.538%,100%{opacity:0}}.l12{animation:l12 26s linear infinite}@keyframes l13{0%,53.654%{opacity:0}54.231%,93.846%{opacity:1}96.538%,100%{opacity:0}}.l13{animation:l13 26s linear infinite}@keyframes l14{0%,55.000%{opacity:0}55.577%,93.846%{opacity:1}96.538%,100%{opacity:0}}.l14{animation:l14 26s linear infinite}@keyframes l15{0%,56.346%{opacity:0}56.923%,93.846%{opacity:1}96.538%,100%{opacity:0}}.l15{animation:l15 26s linear infinite}@keyframes l16{0%,57.692%{opacity:0}58.269%,93.846%{opacity:1}96.538%,100%{opacity:0}}.l16{animation:l16 26s linear infinite}@keyframes l17{0%,60.000%{opacity:0}60.577%,93.846%{opacity:1}96.538%,100%{opacity:0}}.l17{animation:l17 26s linear infinite}@keyframes l18{0%,63.462%{opacity:0}64.038%,93.846%{opacity:1}96.538%,100%{opacity:0}}.l18{animation:l18 26s linear infinite}@keyframes l19{0%,64.231%{opacity:0}64.808%,93.846%{opacity:1}96.538%,100%{opacity:0}}.l19{animation:l19 26s linear infinite}@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}.blink{animation:blink 1.1s steps(1,end) infinite}@keyframes idle{0%,66.923%{opacity:0}67.308%,93.846%{opacity:1}96.538%,100%{opacity:0}}.idle{animation:idle 26s linear infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important}.cover,.blink{display:none}}</style>
</defs>
<g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15">
<rect width="1200" height="720" rx="22" fill="#070707"/>
<rect width="1200" height="720" rx="22" fill="url(#glow)"/>
<rect x="18" y="18" width="1164" height="684" rx="14" fill="#0B0B0B" stroke="#292929"/>
<path d="M18 62H1182" stroke="#292929"/>
<circle cx="44" cy="40" r="6" fill="#2E2E2E"/><circle cx="64" cy="40" r="6" fill="#2E2E2E"/><circle cx="84" cy="40" r="6" fill="#FF6B00"/>
<text x="600" y="45" text-anchor="middle" fill="#9B9B96" font-size="13">~/orders-api — zsh</text>
<text x="1160" y="45" text-anchor="end" fill="#FFB15A" font-size="12" letter-spacing="2.4">MAVERICK <tspan fill="#FF6B00" font-weight="700">AI</tspan></text>
<g clip-path="url(#screen)">
<text class="l0" x="40" y="104"><tspan fill="#FF6B00" font-weight="700">$</tspan><tspan fill="#F7F7F5" dx="9.03">npx @maverick-ai/cli new &quot;Add cursor pagination to the orders endpoint&quot;</tspan></text>
<g class="cover tl0" opacity="0"><rect x="58.06" y="89" width="1200" height="24.5" fill="#0B0B0B"/><rect x="58.06" y="90" width="9.03" height="19" fill="#FF6B00" opacity=".9"/></g>
<text class="l1" x="40" y="128.5"><tspan fill="#38C172">✓ </tspan><tspan fill="#CFCFCA">task created: </tspan><tspan fill="#F7F7F5">add-cursor-pagination-orders-endpoint</tspan></text>
<text class="l2" x="40" y="153"><tspan fill="#9B9B96">  Workflow: </tspan><tspan fill="#FFB15A">Spec Driven</tspan><tspan fill="#9B9B96"> (the idea defines an API, integration or shared contract)</tspan></text>
<text class="l3" x="40" y="177.5"><tspan fill="#9B9B96">  Pipeline: </tspan><tspan fill="#FF6B00">[PRD]</tspan><tspan fill="#CFCFCA"> → SPEC → TECHSPEC → TASKS</tspan></text>
<text class="l4" x="40" y="202"><tspan fill="#9B9B96">  Grounded in: </tspan><tspan fill="#CFCFCA">src/orders/orders.service.ts, src/orders/dto/list-orders.dto.ts (+4 more)</tspan></text>
<text class="l5" x="40" y="226.5"><tspan fill="#FF6B00">▶ opening Claude Code. </tspan><tspan fill="#CFCFCA">The rest of the flow happens there.</tspan></text>
<text class="l6" x="40" y="251"><tspan fill="#6B6B66"># in the agent: PRD → SPEC → TECHSPEC → 3 subtasks, one question at a time, then built and tested</tspan></text>
<text class="l7" x="40" y="288.975"><tspan fill="#FF6B00" font-weight="700">$</tspan><tspan fill="#F7F7F5" dx="9.03">maverick impact src/orders/orders.service.ts</tspan></text>
<g class="cover tl7" opacity="0"><rect x="58.06" y="273.975" width="1200" height="24.5" fill="#0B0B0B"/><rect x="58.06" y="274.975" width="9.03" height="19" fill="#FF6B00" opacity=".9"/></g>
<text class="l8" x="40" y="313.475"><tspan fill="#9B9B96">Direct dependents: </tspan><tspan fill="#F7F7F5">3</tspan><tspan fill="#9B9B96"> · transitive: </tspan><tspan fill="#F7F7F5">7</tspan><tspan fill="#9B9B96"> (2 test files)</tspan></text>
<text class="l9" x="40" y="337.975"><tspan fill="#9B9B96">Entry points affected: </tspan><tspan fill="#F7F7F5">6</tspan><tspan fill="#CFCFCA">  GET /api/v1/orders · POST /api/v1/orders · EVENT payment.confirmed …</tspan></text>
<text class="l10" x="40" y="362.475"><tspan fill="#9B9B96">Tests to run: </tspan><tspan fill="#CFCFCA">src/orders/orders.service.spec.ts, test/orders.e2e-spec.ts</tspan></text>
<text class="l11" x="40" y="400.45000000000005"><tspan fill="#FF6B00" font-weight="700">$</tspan><tspan fill="#F7F7F5" dx="9.03">maverick flow run ship add-cursor-pagination-orders-endpoint</tspan></text>
<g class="cover tl11" opacity="0"><rect x="58.06" y="385.45000000000005" width="1200" height="24.5" fill="#0B0B0B"/><rect x="58.06" y="386.45000000000005" width="9.03" height="19" fill="#FF6B00" opacity=".9"/></g>
<text class="l12" x="40" y="424.95000000000005"><tspan fill="#38C172">PASS </tspan><tspan fill="#F7F7F5">artifacts      </tspan><tspan fill="#9B9B96">PRD · SPEC · TECHSPEC · TASKS complete and traced</tspan></text>
<text class="l13" x="40" y="449.45000000000005"><tspan fill="#38C172">PASS </tspan><tspan fill="#F7F7F5">checks         </tspan><tspan fill="#9B9B96">npm run lint · typecheck · test · build</tspan></text>
<text class="l14" x="40" y="473.95000000000005"><tspan fill="#38C172">PASS </tspan><tspan fill="#F7F7F5">scope          </tspan><tspan fill="#9B9B96">every changed file was declared in the spec</tspan></text>
<text class="l15" x="40" y="498.45000000000005"><tspan fill="#38C172">PASS </tspan><tspan fill="#F7F7F5">security       </tspan><tspan fill="#9B9B96">no high-signal risks in the diff</tspan></text>
<text class="l16" x="40" y="522.95"><tspan fill="#38C172">PASS </tspan><tspan fill="#F7F7F5">dependencies   </tspan><tspan fill="#9B9B96">0 manifests, 0 lockfiles changed</tspan></text>
<text class="l17" x="40" y="547.45"><tspan fill="#F6AD55">WAIT </tspan><tspan fill="#F7F7F5">human-review   </tspan><tspan fill="#9B9B96">a human reviews the change and records the decision</tspan></text>
<text class="l18" x="40" y="585.4250000000001"><tspan fill="#F7F7F5">Outcome: </tspan><tspan fill="#FF6B00">AWAITING-APPROVAL</tspan><tspan fill="#9B9B96"> (failed iteration 0/3)</tspan></text>
<text class="l19" x="40" y="609.9250000000001"><tspan fill="#CFCFCA">Blocking checks pass; a human must record the pending approval(s).</tspan></text>
</g>
<g class="idle"><text x="40" y="647.9000000000001"><tspan fill="#FF6B00" font-weight="700">$</tspan></text><rect class="blink" x="58.06" y="633.9000000000001" width="9.03" height="19" fill="#FF6B00" opacity=".9"/></g>
<text x="1160" y="682" text-anchor="end" fill="#6B6B66" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13">Context before code. Evidence before merge.</text>
</g>
</svg>
